name: CLI regression checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run CLI regression checks
        run: python3 -X utf8 tests/cli_regression.py -v
